---
name: isle-site-template

# Common to all services
x-common: &common
  restart: unless-stopped
  tty: true # Required for non-root users with selinux enabled.
  security_opt:
    - label=type:container_runtime_t # Required for selinux to access the docker socket and bind mount files.
  networks:
    default:
networks:
  default:

volumes:
  activemq-data: {}
  drupal-private-files: {}
  drupal-public-files: {}
  drupal-solr-config: {}
  mariadb-data: {}
  solr-data: {}
  triplet-cache: {}

secrets:
  # Certificates are only used for development environments.
  CERT_PUBLIC_KEY:
    file: ./certs/cert.pem
  CERT_AUTHORITY:
    file: ./certs/rootCA.pem
  UID:
    file: ./certs/UID
  # Production secrets:
  ACTIVEMQ_PASSWORD:
    file: "./secrets/ACTIVEMQ_PASSWORD"
  ACTIVEMQ_WEB_ADMIN_PASSWORD:
    file: "./secrets/ACTIVEMQ_WEB_ADMIN_PASSWORD"
  ALPACA_JMS_PASSWORD:
    file: "./secrets/ACTIVEMQ_PASSWORD"
  DB_ROOT_PASSWORD:
    file: "./secrets/DB_ROOT_PASSWORD"
  DRUPAL_DEFAULT_ACCOUNT_PASSWORD:
    file: "./secrets/DRUPAL_DEFAULT_ACCOUNT_PASSWORD"
  DRUPAL_DEFAULT_DB_PASSWORD:
    file: "./secrets/DRUPAL_DEFAULT_DB_PASSWORD"
  DRUPAL_DEFAULT_SALT:
    file: "./secrets/DRUPAL_DEFAULT_SALT"
  FCREPO_DB_PASSWORD:
    file: "./secrets/FCREPO_DB_PASSWORD"
  JWT_ADMIN_TOKEN:
    file: "./secrets/JWT_ADMIN_TOKEN"
  JWT_PUBLIC_KEY:
    file: "./secrets/JWT_PUBLIC_KEY"
  JWT_PRIVATE_KEY:
    file: "./secrets/JWT_PRIVATE_KEY"

services:
  activemq:
    <<: *common
    image: libops/activemq:5@sha256:dbe96ff6b2a3011056f16b3a0d86d85e02c1654371f715236bc4d0fa65ee73b5
    secrets:
      - source: ACTIVEMQ_PASSWORD
      - source: ACTIVEMQ_WEB_ADMIN_PASSWORD
    volumes:
      - activemq-data:/opt/activemq/data:rw

  alpaca:
    <<: *common
    depends_on:
      activemq:
        condition: service_healthy
    image: libops/alpaca:2.4@sha256:f2c677e7eac6cbd691576fe464345783f378f1e6da91542399cd0b290c9c347f
    secrets:
      - source: ALPACA_JMS_PASSWORD
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY

    environment:
      ALPACA_FCREPO_INDEXER_ENABLED: "false"
      ALPACA_TRIPLESTORE_INDEXER_ENABLED: "false"
  crayfits:
    <<: *common
    image: libops/crayfits:main@sha256:730ccc390a40cd744227c62b684aa0d32766edbc4720aadee5248ed3b341006d
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_ADMIN_TOKEN
      - source: JWT_PUBLIC_KEY

  drupal:
    <<: *common
    build:
      args:
        REPOSITORY: libops
        TAG: nginx-1.30.3-php84
      context: .
    environment:
      DEVELOPMENT_ENVIRONMENT: "false"
      DRUPAL_DEFAULT_BROKER_HOST: activemq
      DRUPAL_DEFAULT_BROKER_PORT: "61613"
      DRUPAL_DEFAULT_BROKER_URL: tcp://activemq:61613
      DRUPAL_DEFAULT_CANTALOUPE_URL: "http://localhost/iiif/3"
      DRUPAL_DEFAULT_CONFIGDIR: /var/www/drupal/config/sync
      DRUPAL_DEFAULT_INSTALL_EXISTING_CONFIG: "true"
      DRUPAL_DEFAULT_NAME: Islandora Digital Collections
      DRUPAL_DEFAULT_PROFILE: minimal
      DRUPAL_DEFAULT_SITE_URL: http://localhost
      DRUPAL_DEFAULT_SOLR_CORE: default
      DRUPAL_DEFAULT_SOLR_HOST: solr
      DRUPAL_DEFAULT_SOLR_PORT: "8983"
      DRUPAL_ENABLE_HTTPS: "false"
      DRUSH_OPTIONS_URI: http://localhost
      DRUPAL_DEFAULT_TRIPLESTORE_NAMESPACE: ""
    healthcheck:
      start_period: ${DRUPAL_HEALTHCHECK_START_PERIOD:-5m}
      retries: ${DRUPAL_HEALTHCHECK_RETRIES:-20}
    depends_on:
      mariadb:
        condition: service_healthy
    image: islandora.io/isle-site-template:local
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: UID
      - source: DB_ROOT_PASSWORD
      - source: DRUPAL_DEFAULT_ACCOUNT_PASSWORD
      - source: DRUPAL_DEFAULT_DB_PASSWORD
      - source: DRUPAL_DEFAULT_SALT
      - source: JWT_PRIVATE_KEY
      - source: JWT_PUBLIC_KEY
    volumes:
      - read_only: false
        source: drupal-public-files
        target: /var/www/drupal/web/sites/default/files
        type: volume
      - read_only: false
        source: drupal-private-files
        target: /var/www/drupal/private
        type: volume
      - drupal-solr-config:/opt/solr/server/solr/default:z,rw

  fits:
    <<: *common
    image: libops/fits@sha256:6c782155276bf35e51f645ce2ff13be1d7ba47300d60041e7969707b760976e7

  homarus:
    <<: *common
    image: libops/homarus:8.1.2
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_ADMIN_TOKEN
      - source: JWT_PUBLIC_KEY

  houdini:
    <<: *common
    image: libops/houdini:8.18.2
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_ADMIN_TOKEN
      - source: JWT_PUBLIC_KEY

  hypercube:
    <<: *common
    image: libops/hypercube:5.5.2
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_ADMIN_TOKEN
      - source: JWT_PUBLIC_KEY

  init:
    entrypoint: /scripts/init-entrypoint.sh
    image: libops/base:3.2.2.0@sha256:60c788c0dcf1fed021ee17d2847a45dde2b559ecef19b5fa11c2314356976ba9
    networks:
      default:
    profiles:
      - none
    restart: "no"
    security_opt:
      - label=type:container_runtime_t
    volumes:
      - ./certs:/certs:rw
      - ./secrets:/secrets:rw
      - ./scripts:/scripts:ro
      - ./docker-compose.yml:/docker-compose.yml:ro
      - .:/drupal:rw
      - /var/run/docker.sock:/var/run/docker.sock:z

  mariadb:
    <<: *common
    image: libops/mariadb:11.8@sha256:faab6f2e647fc8fd0a2bb5d9d8632428e91bb19d22b23ce46f56007fe5af84e3
    secrets:
      - source: DB_ROOT_PASSWORD
    volumes:
      - mariadb-data:/var/lib/mysql:rw

  mergepdf:
    <<: *common
    image: libops/mergepdf:main@sha256:2a174bd377bc3835023ffaa5583fd7975a9907fec0d9ff9ad0c3663f581bee08
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: JWT_ADMIN_TOKEN
      - source: JWT_PUBLIC_KEY

  solr:
    <<: *common
    depends_on:
      drupal:
        condition: service_healthy
    image: libops/solr:9@sha256:e2fa2dac06add4d844f0856d5c698c10d302d315f3b05ce4fa91b0e3701fa179
    volumes:
      - solr-data:/data:rw
      - read_only: false
        source: drupal-solr-config
        target: /opt/solr/server/solr/default
        type: volume
        volume:
          nocopy: true

  traefik:
    <<: *common
    command: >-
      --ping=true
      --log.level=INFO
      --entryPoints.http.address=:80
      --entryPoints.http.transport.respondingTimeouts.readTimeout=300s
      --providers.file.directory=/etc/traefik/dynamic
      --providers.docker=true
      --providers.docker.network=default
      --providers.docker.exposedByDefault=false
      --api.insecure=false
      --api.dashboard=false
      --api.debug=false
    depends_on:
      drupal:
        condition: service_healthy
    healthcheck:
      start_period: 10s
      test: traefik healthcheck --ping
    image: traefik:v3.7.5@sha256:e4d98158c01ad752fc1071d4e9573788747230d902cdde00a772516e692d07c9
    networks:
      default:
        aliases:
          - drupal.localhost
          - fcrepo.localhost
    ports:
      - "80:80"
    security_opt:
      - label=type:container_runtime_t
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:z
      - ./conf/traefik:/etc/traefik/dynamic:ro

  triplet:
    <<: *common
    image: ghcr.io/libops/triplet:v1.1.2@sha256:da42e55c265af7c02d4351e8ea97aa249c6b354b837a03f8c7c372241b1126df
    environment:
      TRIPLET_PUBLIC_BASE_URL: http://localhost
    volumes:
      - drupal-public-files:/public:ro
      - drupal-private-files:/private:ro
      - ./certs/rootCA.pem:/etc/ssl/certs/lehigh.pem:ro
      - ./conf/triplet/config.yaml:/etc/triplet/config.yaml:ro
      - triplet-cache:/var/lib/triplet/cache:rw
