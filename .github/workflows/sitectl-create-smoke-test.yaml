name: sitectl-create-smoke-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitectl-create-smoke-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jwt-keypair-reset:
    name: Islandora JWT reset contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify repeatable JWT initialization
        run: bash scripts/test-islandora-jwt-reset.sh

  create:
    name: sitectl create isle ${{ matrix.create_definition }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - create_definition: default
            create_args: >-
              --fcrepo off
              --blazegraph off
              --isle-file-system-uri private
              --iiif triplet
              --iiif-topology disabled
              --bot-mitigation off
    uses: libops/.github/.github/workflows/sitectl-create-smoke-test.yaml@92a70c027cfe2553a8bc4adaba67a3e620ff6958 # main
    with:
      plugin: isle
      create-definition: ${{ matrix.create_definition }}
      create-args: ${{ matrix.create_args }}
      local-plugin-path: sitectl-isle
      local-plugin-repository: libops/sitectl-isle
      local-plugin-ref: 48759729ab47cbe11be4c363638538e0f919e23a
      packages: sitectl sitectl-drupal
      package-versions: sitectl=1.8.1 sitectl-drupal=1.3.0
      allow-unversioned-packages: false
      run-verify: true
